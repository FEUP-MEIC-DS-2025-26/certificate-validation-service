name: Deploy changes

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  PROJECT_ID: made-in-portugal-dsle
  REGION: europe-southwest1
  REPOSITORY: t01g01-registry
  IMAGE_NAME: certificate-validation
  REGISTRY: europe-southwest1-docker.pkg.dev
  BUCKET_NAME: made-in-portugal-certificates
  REQUEST_TOPIC: certificate-validation
  RESPONSE_TOPIC: certificate-validatior-response
  REQUEST_SUBSCRIPTION: certificate-validation-sub 
  RESPONSE_SUBSCRIPTION: certificate-validator-response-sub

jobs:
  docker:
    runs-on: self-hosted
    outputs:
      IMAGE_URI: ${{ steps.build-image.outputs.IMAGE_URI }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Google Cloud authentication
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and Push Docker image
        id: build-image
        run: |
          IMAGE_URI="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_OUTPUT
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

  terraform:
    needs: docker
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Google Cloud authentication
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -input=false -var "docker_image=${{ needs.docker.outputs.IMAGE_URI }}" -var="project_id=${{ env.PROJECT_ID }}" -var="bucket_name=${{ env.BUCKET_NAME }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -var "docker_image=${{ needs.docker.outputs.IMAGE_URI }}" -var="project_id=${{ env.PROJECT_ID }}" -var="bucket_name=${{ env.BUCKET_NAME }}"
